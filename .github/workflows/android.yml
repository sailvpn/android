name: Android Release Build (Direct Distribution)

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever a version tag like v1.0.0 is pushed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required by Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Linux permissions allow the Gradle wrapper script to run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Step 4: Compile ONLY the unsigned release APK
      - name: Compile Release APK
        run: ./gradlew assembleRelease

      # Step 5: Decode Keystore and Sign using Native Android SDK Tools (V2 & V3 Scheme)
      - name: Sign APK with Native apksigner
        run: |
          # 1. Recreate the binary keystore file from your Base64 secret string
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks
          
          # 2. Locate the newest Android build tools pre-installed on the GitHub runner
          BUILD_TOOLS_DIR=$(dirname $(find /usr/local/lib/android/sdk/build-tools -name apksigner -type f | sort -V | tail -n1))
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # 3. Zip-align the raw build output file
          $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned-release.apk
          
          # 4. Perform native modern code signing (Applies V2, V3, and V4 signatures dynamically)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out troad-release.apk aligned-release.apk
          
          # 5. Print verification mapping to the action logs to guarantee V2/V3 success
          $BUILD_TOOLS_DIR/apksigner verify -v troad-release.apk

      # Step 6: Upload the cleanly-named signed APK package as an action artifact
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: manual-testing-apk
          path: troad-release.apk
          retention-days: 1

      # Step 7: Push the verified final APK file directly into the GitHub Release dashboard
      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: troad-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





