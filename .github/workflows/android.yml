name: Android Release Build (Resilient CI Pipeline)

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever a version tag like v1.0.0 is pushed from any branch

# Explicitly grants the script permission to write binaries to your Releases page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required by Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Linux permissions allow the Gradle wrapper script to run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Step 4: Run Gradle to compile BOTH the release APK and the release AAB bundle
      - name: Compile Both Packages
        run: ./gradlew assembleRelease bundleRelease

      # Step 5: Resiliency Map - Scans directory and logs exact paths for troubleshooting
      - name: Map Build Outputs Structure
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -type f
          echo "=== Searching for generated AAB files ==="
          find . -name "*.aab" -type f

      # Step 6: Upload the traditional APK package using a global directory search
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: manual-testing-apk
          path: "**/build/outputs/apk/release/*.apk"
          retention-days: 1

      # Step 7: Upload the App Bundle (AAB) package using a global directory search
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: production-play-store-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          retention-days: 1

      # Step 8: Push the compiled files directly into the GitHub Release dashboard
      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
