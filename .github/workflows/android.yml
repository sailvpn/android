name: Android Release Build (Resilient CI Pipeline)

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever a version tag like v1.0.0 is pushed from any branch

# Explicitly grants the script permission to write binaries to your Releases page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required by Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Linux permissions allow the Gradle wrapper script to run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Step 4: Run Gradle to compile BOTH the release APK and the release AAB bundle
      - name: Compile Both Packages
        run: ./gradlew assembleRelease bundleRelease

      # Step 5: Sign the generated release APK and AAB so Android devices can install them
      - name: Sign Release Artifacts
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Step 6: Resiliency Map - Scans directory and logs exact paths for troubleshooting
      - name: Map Build Outputs Structure
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -type f
          echo "=== Searching for generated AAB files ==="
          find . -name "*.aab" -type f

      # Step 7: Upload the signed APK package (using the output from the signing step)
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: manual-testing-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 1

      # Step 8: Upload the Play Store App Bundle (AAB) package
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: production-play-store-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          retention-days: 1

      # Step 9: Push the signed compiled files directly into the GitHub Release dashboard
      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            **/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

