name: Android Release Build (AAB & APK)

# Trigger the workflow only on pushes or pull requests to the 'release' branch
on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required by Gradle
      # (Uses JDK 17 and enables automatic Gradle dependency caching to speed up future runs)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Linux permissions allow the Gradle wrapper script to run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Step 4: Run Gradle to compile BOTH the release APK and the release AAB bundle
      - name: Compile Both Packages
        run: ./gradlew assembleRelease bundleRelease

      # Step 5: Upload the traditional APK package as a downloadable artifact
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: manual-testing-apk
          path: app/build/outputs/apk/release/sail.apk

      # Step 6: Upload the App Bundle (AAB) package as a downloadable artifact
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: production-play-store-bundle
          path: app/build/outputs/bundle/release/sail.aab
