name: Android Release Build (Direct Distribution)

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever a version tag like v1.0.0 is pushed

# Explicitly grants the script permission to write binaries to your Releases page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required by Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Linux permissions allow the Gradle wrapper script to run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Step 4: Compile ONLY the release APK
      - name: Compile Release APK
        run: ./gradlew assembleRelease

      # Step 5: Sign the generated release APK with a modern build-tools override
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      # Step 6: Rename the weirdly named APK to a clean, user-friendly name
      - name: Clean Up APK Filename
        id: rename_apk
        run: |
          OLD_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          NEW_PATH="app/build/outputs/apk/release/troad-release.apk"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "final_apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      # Step 7: Scans directory and logs exact paths for troubleshooting
      - name: Map Build Outputs Structure
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -type f

      # Step 8: Upload the signed, cleanly named APK package as an action artifact
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: manual-testing-apk
          path: ${{ steps.rename_apk.outputs.final_apk_path }}
          retention-days: 1

      # Step 9: Push the clean APK file directly into the GitHub Release dashboard
      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




